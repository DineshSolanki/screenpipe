# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpi.pe

name: Build source apps

on:
  workflow_dispatch:
  push:
    branches:
      - "source-build/**"

concurrency:
  group: build-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build:
    name: Build Linux AppImage and Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/screenpipe-app-tauri/src-tauri
          shared-key: linux-source-x86_64-unknown-linux-gnu
          cache-bin: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            ffmpeg \
            tesseract-ocr \
            cmake \
            clang \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libssl-dev \
            libtesseract-dev \
            libxdo-dev \
            libsdl2-dev \
            libclang-dev \
            libxtst-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            curl \
            pkg-config \
            libsqlite3-dev \
            libbz2-dev \
            zlib1g-dev \
            libonig-dev \
            libayatana-appindicator3-dev \
            libsamplerate-dev \
            libwebrtc-audio-processing-dev \
            libpipewire-0.3-dev \
            libpipewire-0.3-modules \
            libspa-0.2-modules \
            pipewire-bin \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            xdg-desktop-portal-gtk \
            libsecret-1-dev \
            libopenblas-dev

          sudo mkdir -p /usr/lib/x86_64-linux-gnu/openblas/lib
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.so /usr/lib/x86_64-linux-gnu/openblas/lib/liblibopenblas.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.a /usr/lib/x86_64-linux-gnu/openblas/lib/liblibopenblas.a
          echo "OPENBLAS_PATH=/usr/lib/x86_64-linux-gnu/openblas" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: apps/screenpipe-app-tauri
        run: bun install --frozen-lockfile

      - name: Configure source build without updater signing
        shell: bash
        run: |
          set -euxo pipefail
          cp apps/screenpipe-app-tauri/src-tauri/tauri.prod.conf.json \
             apps/screenpipe-app-tauri/src-tauri/tauri.conf.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("apps/screenpipe-app-tauri/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["build"]["beforeBuildCommand"] = "bun run build"
          config["bundle"]["createUpdaterArtifacts"] = False
          config.setdefault("plugins", {}).setdefault("updater", {})["active"] = False
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Prepare native app dependencies
        working-directory: apps/screenpipe-app-tauri
        env:
          CI: "true"
          SKIP_SCREENPIPE_SETUP: "true"
          SCREENPIPE_RELEASE_TARGET: x86_64-unknown-linux-gnu
        run: bun ./scripts/pre_build.js

      - name: Build source app
        working-directory: apps/screenpipe-app-tauri
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CI: "true"
          GGML_AVX512: "OFF"
          GGML_AVX512_BF16: "OFF"
          GGML_AVX512_VBMI: "OFF"
          GGML_AVX512_VNNI: "OFF"
          GGML_NATIVE: "OFF"
          NO_STRIP: "1"
          SCREENPIPE_RELEASE_TARGET: x86_64-unknown-linux-gnu
          CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF
        run: |
          set -euxo pipefail

          sudo mv /usr/bin/ldd /usr/bin/ldd.real
          sudo tee /usr/bin/ldd > /dev/null <<'WRAPPER'
          #!/bin/bash
          if [[ "$1" == *"/bun"* ]] || [[ "$1" == *"bun-"* ]]; then
            echo "	statically linked"
            exit 0
          fi
          exec /usr/bin/ldd.real "$@"
          WRAPPER
          sudo chmod +x /usr/bin/ldd

          export DEPLOY_GTK_VERSION=3
          bunx tauri build --verbose \
            --target x86_64-unknown-linux-gnu \
            --config src-tauri/tauri.linux.conf.json \
            --features redact-onnx-cpu

      - name: Repack AppImage with bundled runtime dependencies
        working-directory: apps/screenpipe-app-tauri
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          appimage="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "${appimage}"
          chmod +x "${appimage}"
          "${appimage}" --appimage-extract

          "${GITHUB_WORKSPACE}/.github/scripts/linux/bundle-appimage-runtime-deps.sh" squashfs-root
          rm -f squashfs-root/usr/lib/libglib-2.0.so* \
                squashfs-root/usr/lib/libgobject-2.0.so* \
                squashfs-root/usr/lib/libgio-2.0.so* \
                squashfs-root/usr/lib/libgmodule-2.0.so* \
                squashfs-root/usr/lib/libmount.so* \
                squashfs-root/usr/lib/libblkid.so* \
                squashfs-root/usr/lib/libpcre2-8.so* \
                squashfs-root/usr/lib/libsharpyuv.so* \
                squashfs-root/usr/lib/libavif.so*
          install -m 0755 src-tauri/bun-x86_64-unknown-linux-gnu squashfs-root/usr/bin/bun

          if ls squashfs-root/usr/lib/libsharpyuv.so* squashfs-root/usr/lib/libavif.so* 2>/dev/null; then
            echo "::error::bundled libavif/libsharpyuv still present after strip"
            exit 1
          fi

          ARCH=x86_64 /tmp/appimagetool squashfs-root "${appimage}"
          rm -rf squashfs-root

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe-linux-x86_64
          path: |
            apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows NSIS installer
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: C:\t
      GIT_LFS_SKIP_SMUDGE: "1"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/screenpipe-app-tauri/src-tauri
          shared-key: windows-source-x86_64-pc-windows-msvc
          cache-bin: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM and 7-Zip
        shell: pwsh
        run: |
          choco install llvm 7zip.install --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Failed to install LLVM or 7-Zip" }
          if (-not (Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            throw "libclang.dll not found at $env:LIBCLANG_PATH"
          }
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Shorten Cargo target path
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:CARGO_TARGET_DIR)) {
            New-Item -ItemType Directory -Path $env:CARGO_TARGET_DIR | Out-Null
          }
          $target = "apps\screenpipe-app-tauri\src-tauri\target"
          if (Test-Path -LiteralPath $target) {
            Remove-Item -LiteralPath $target -Recurse -Force
          }
          cmd /c mklink /J $target $env:CARGO_TARGET_DIR
          if ($LASTEXITCODE -ne 0) { throw "Failed to create short Cargo target junction" }

      - name: Install Windows frontend dependencies
        uses: ./.github/actions/install-windows-frontend-dependencies

      - name: Configure source build without updater signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item apps/screenpipe-app-tauri/src-tauri/tauri.prod.conf.json `
            apps/screenpipe-app-tauri/src-tauri/tauri.conf.json -Force
          $configPath = "apps/screenpipe-app-tauri/src-tauri/tauri.conf.json"
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.build.beforeBuildCommand = "bun run build"
          $config.bundle.createUpdaterArtifacts = $false
          $config.bundle.windows.PSObject.Properties.Remove("signCommand")
          $config.plugins.updater.active = $false
          $config | ConvertTo-Json -Depth 100 |
            Set-Content -LiteralPath $configPath -Encoding utf8

      - name: Download ONNX Runtime and DirectML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.24.2'
          $directMlVersion = '1.15.4'
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/$version" `
            -OutFile ort-dml.zip
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/$directMlVersion" `
            -OutFile directml.zip
          7z x ort-dml.zip -oort-dml -y
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract ONNX Runtime package" }
          7z x directml.zip -odirectml -y
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract DirectML package" }

          $libDir = "apps/screenpipe-app-tauri/src-tauri/onnxruntime-win-x64-$version/lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          Copy-Item ort-dml/runtimes/win-x64/native/onnxruntime.dll $libDir
          Copy-Item ort-dml/runtimes/win-x64/native/onnxruntime.lib $libDir
          Copy-Item directml/bin/x64-win/DirectML.dll $libDir
          $resolvedLibDir = (Resolve-Path $libDir).Path
          "ORT_STRATEGY=system" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ORT_LIB_LOCATION=$resolvedLibDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ORT_PREFER_DYNAMIC_LINK=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $resolvedLibDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          ./.github/scripts/setup-vulkan-windows.ps1 `
            -Architecture x64 `
            -StageRuntimeDirectory $libDir
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage Vulkan runtime" }

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          ./.github/scripts/setup-vulkan-windows.ps1 -Architecture x64 -InstallSdk
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Vulkan SDK" }

      - name: Configure Ninja
        shell: pwsh
        run: ./.github/scripts/setup-ninja-windows.ps1

      - name: Prepare native app dependencies
        working-directory: apps/screenpipe-app-tauri
        env:
          CI: "true"
          SKIP_SCREENPIPE_SETUP: "true"
          SCREENPIPE_RELEASE_TARGET: x86_64-pc-windows-msvc
        run: bun ./scripts/pre_build.js

      - name: Build source app
        working-directory: apps/screenpipe-app-tauri
        shell: pwsh
        env:
          CI: "true"
          CMAKE_ARGS: -DGGML_NATIVE=OFF
          GGML_NATIVE: "OFF"
          SCREENPIPE_RELEASE_TARGET: x86_64-pc-windows-msvc
        run: |
          bunx tauri build --verbose `
            --target x86_64-pc-windows-msvc `
            --config src-tauri/tauri.windows.conf.json `
            --features directml,vulkan,redact-onnx-directml
          if ($LASTEXITCODE -ne 0) { throw "Windows source build failed: $LASTEXITCODE" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe-windows-x86_64
          path: apps/screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
