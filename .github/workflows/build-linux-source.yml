# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpi.pe

name: Build Linux source app

on:
  workflow_dispatch:
  push:
    branches:
      - "source-build/**"

concurrency:
  group: build-linux-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build:
    name: Build Linux AppImage and Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/screenpipe-app-tauri/src-tauri
          shared-key: linux-source-x86_64-unknown-linux-gnu
          cache-bin: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            ffmpeg \
            tesseract-ocr \
            cmake \
            clang \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libssl-dev \
            libtesseract-dev \
            libxdo-dev \
            libsdl2-dev \
            libclang-dev \
            libxtst-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            curl \
            pkg-config \
            libsqlite3-dev \
            libbz2-dev \
            zlib1g-dev \
            libonig-dev \
            libayatana-appindicator3-dev \
            libsamplerate-dev \
            libwebrtc-audio-processing-dev \
            libpipewire-0.3-dev \
            libpipewire-0.3-modules \
            libspa-0.2-modules \
            pipewire-bin \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            xdg-desktop-portal-gtk \
            libsecret-1-dev \
            libopenblas-dev

          sudo mkdir -p /usr/lib/x86_64-linux-gnu/openblas/lib
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.so /usr/lib/x86_64-linux-gnu/openblas/lib/liblibopenblas.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.a /usr/lib/x86_64-linux-gnu/openblas/lib/liblibopenblas.a
          echo "OPENBLAS_PATH=/usr/lib/x86_64-linux-gnu/openblas" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: apps/screenpipe-app-tauri
        run: bun install --frozen-lockfile

      - name: Configure source build without updater signing
        shell: bash
        run: |
          set -euxo pipefail
          cp apps/screenpipe-app-tauri/src-tauri/tauri.prod.conf.json \
             apps/screenpipe-app-tauri/src-tauri/tauri.conf.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("apps/screenpipe-app-tauri/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["build"]["beforeBuildCommand"] = "bun run build"
          config["bundle"]["createUpdaterArtifacts"] = False
          config.setdefault("plugins", {}).setdefault("updater", {})["active"] = False
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Prepare native app dependencies
        working-directory: apps/screenpipe-app-tauri
        env:
          CI: "true"
          SKIP_SCREENPIPE_SETUP: "true"
          SCREENPIPE_RELEASE_TARGET: x86_64-unknown-linux-gnu
        run: bun ./scripts/pre_build.js

      - name: Build source app
        working-directory: apps/screenpipe-app-tauri
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CI: "true"
          GGML_AVX512: "OFF"
          GGML_AVX512_BF16: "OFF"
          GGML_AVX512_VBMI: "OFF"
          GGML_AVX512_VNNI: "OFF"
          GGML_NATIVE: "OFF"
          NO_STRIP: "1"
          SCREENPIPE_RELEASE_TARGET: x86_64-unknown-linux-gnu
          CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF
        run: |
          set -euxo pipefail

          sudo mv /usr/bin/ldd /usr/bin/ldd.real
          sudo tee /usr/bin/ldd > /dev/null <<'WRAPPER'
          #!/bin/bash
          if [[ "$1" == *"/bun"* ]] || [[ "$1" == *"bun-"* ]]; then
            echo "	statically linked"
            exit 0
          fi
          exec /usr/bin/ldd.real "$@"
          WRAPPER
          sudo chmod +x /usr/bin/ldd

          export DEPLOY_GTK_VERSION=3
          bunx tauri build --verbose \
            --target x86_64-unknown-linux-gnu \
            --config src-tauri/tauri.linux.conf.json \
            --features redact-onnx-cpu

      - name: Repack AppImage with bundled runtime dependencies
        working-directory: apps/screenpipe-app-tauri
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          appimage="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "${appimage}"
          chmod +x "${appimage}"
          "${appimage}" --appimage-extract

          "${GITHUB_WORKSPACE}/.github/scripts/linux/bundle-appimage-runtime-deps.sh" squashfs-root
          rm -f squashfs-root/usr/lib/libglib-2.0.so* \
                squashfs-root/usr/lib/libgobject-2.0.so* \
                squashfs-root/usr/lib/libgio-2.0.so* \
                squashfs-root/usr/lib/libgmodule-2.0.so* \
                squashfs-root/usr/lib/libmount.so* \
                squashfs-root/usr/lib/libblkid.so* \
                squashfs-root/usr/lib/libpcre2-8.so* \
                squashfs-root/usr/lib/libsharpyuv.so* \
                squashfs-root/usr/lib/libavif.so*
          install -m 0755 src-tauri/bun-x86_64-unknown-linux-gnu squashfs-root/usr/bin/bun

          if ls squashfs-root/usr/lib/libsharpyuv.so* squashfs-root/usr/lib/libavif.so* 2>/dev/null; then
            echo "::error::bundled libavif/libsharpyuv still present after strip"
            exit 1
          fi

          ARCH=x86_64 /tmp/appimagetool squashfs-root "${appimage}"
          rm -rf squashfs-root

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe-linux-x86_64
          path: |
            apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            apps/screenpipe-app-tauri/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
